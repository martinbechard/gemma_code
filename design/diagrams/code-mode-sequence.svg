<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1320" viewBox="0 0 1180 1320" role="img" aria-labelledby="title desc">
  <title id="title">Code mode sequence diagram</title>
  <desc id="desc">Sequence diagram with four timelines: User, App, Harness, and Model. Code mode binds to a user-selected working directory, assembles and reviews a plan, retries rejected semantic reviews, accepts pass or corrected plans, resets into execution, gathers tool evidence, verifies each step, and reports completion.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31546f" />
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7f8d" />
    </marker>
    <style>
      .background { fill: #f7f4ee; }
      .panel { fill: #fffdf8; stroke: #d9d1c2; stroke-width: 1.5; }
      .title { fill: #21313d; font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #56636e; font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 500; }
      .participant { fill: #ffffff; stroke: #31546f; stroke-width: 2; }
      .participant-text { fill: #21313d; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .lifeline { stroke: #9aa6ae; stroke-width: 2; stroke-dasharray: 8 9; }
      .message { stroke: #31546f; stroke-width: 2.4; marker-end: url(#arrow); }
      .message-soft { stroke: #6f7f8d; stroke-width: 2.2; marker-end: url(#arrow-soft); }
      .label { fill: #243440; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .small-label { fill: #50616f; font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .note { fill: #eef5f4; stroke: #7aa69b; stroke-width: 1.5; }
      .note-text { fill: #24443f; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .loop { fill: none; stroke: #c7945d; stroke-width: 2; stroke-dasharray: 7 7; }
      .loop-label-bg { fill: #fff7ea; stroke: #c7945d; stroke-width: 1.2; }
      .loop-label { fill: #7a4b16; font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect class="background" x="0" y="0" width="1180" height="1320" />
  <rect class="panel" x="28" y="28" width="1124" height="1264" rx="18" />

  <text class="title" x="64" y="78">Code Mode</text>
  <text class="subtitle" x="64" y="107">Project-working workflow. The harness plans, reviews, executes, and verifies against the selected working directory.</text>

  <g>
    <rect class="participant" x="90" y="132" width="150" height="48" rx="10" />
    <text class="participant-text" x="165" y="162">User</text>

    <rect class="participant" x="350" y="132" width="150" height="48" rx="10" />
    <text class="participant-text" x="425" y="162">App</text>

    <rect class="participant" x="610" y="132" width="150" height="48" rx="10" />
    <text class="participant-text" x="685" y="162">Harness</text>

    <rect class="participant" x="870" y="132" width="150" height="48" rx="10" />
    <text class="participant-text" x="945" y="162">Model</text>
  </g>

  <line class="lifeline" x1="165" y1="180" x2="165" y2="1258" />
  <line class="lifeline" x1="425" y1="180" x2="425" y2="1258" />
  <line class="lifeline" x1="685" y1="180" x2="685" y2="1258" />
  <line class="lifeline" x1="945" y1="180" x2="945" y2="1258" />

  <line class="message" x1="165" y1="220" x2="425" y2="220" />
  <text class="label" x="295" y="210">Choose Code; select project folder</text>

  <line class="message" x1="425" y1="282" x2="685" y2="282" />
  <text class="label" x="555" y="272">mode code + workingDir</text>

  <rect class="note" x="546" y="320" width="278" height="52" rx="8" />
  <text class="note-text" x="685" y="342">Bind workspace override</text>
  <text class="note-text" x="685" y="361">and resolve code prompt</text>

  <line class="message" x1="685" y1="406" x2="945" y2="406" />
  <text class="label" x="815" y="396">Planning prompt with read-only tools</text>

  <rect class="loop" x="602" y="438" width="432" height="162" rx="10" />
  <rect class="loop-label-bg" x="614" y="428" width="150" height="24" rx="6" />
  <text class="loop-label" x="626" y="445">Plan assembly</text>

  <line class="message-soft" x1="945" y1="478" x2="685" y2="478" />
  <text class="label" x="815" y="468">Read-only action or Step YAML</text>

  <line class="message-soft" x1="685" y1="532" x2="945" y2="532" />
  <text class="label" x="815" y="522">Inspection result or validation</text>

  <line class="message-soft" x1="685" y1="586" x2="425" y2="586" />
  <text class="label" x="555" y="576">Planning activity and plan nodes</text>

  <rect class="loop" x="602" y="628" width="432" height="206" rx="10" />
  <rect class="loop-label-bg" x="614" y="618" width="178" height="24" rx="6" />
  <text class="loop-label" x="626" y="635">Semantic review loop</text>

  <line class="message" x1="685" y1="670" x2="945" y2="670" />
  <text class="label" x="815" y="660">Structured review prompt</text>

  <line class="message" x1="945" y1="724" x2="685" y2="724" />
  <text class="label" x="815" y="714">Review YAML</text>

  <line class="message-soft" x1="685" y1="778" x2="945" y2="778" />
  <text class="label" x="815" y="768">Retry prompt when rejected</text>

  <line class="message-soft" x1="945" y1="818" x2="685" y2="818" />
  <text class="label" x="815" y="808">Pass or valid corrected plan</text>

  <line class="message" x1="685" y1="870" x2="425" y2="870" />
  <text class="label" x="555" y="860">Plan reviewed event</text>

  <line class="message" x1="685" y1="930" x2="945" y2="930" />
  <text class="label" x="815" y="920">Reset into execution prompt</text>

  <rect class="loop" x="602" y="962" width="432" height="170" rx="10" />
  <rect class="loop-label-bg" x="614" y="952" width="176" height="24" rx="6" />
  <text class="loop-label" x="626" y="969">Per-step execution</text>

  <line class="message-soft" x1="945" y1="1002" x2="685" y2="1002" />
  <text class="label" x="815" y="992">Tool action or step summary</text>

  <line class="message-soft" x1="685" y1="1056" x2="945" y2="1056" />
  <text class="label" x="815" y="1046">Tool result and evidence</text>

  <line class="message-soft" x1="685" y1="1110" x2="945" y2="1110" />
  <text class="label" x="815" y="1100">Verify prompt for step</text>

  <line class="message" x1="945" y1="1172" x2="685" y2="1172" />
  <text class="label" x="815" y="1162">Pass, fail, or retry reason</text>

  <line class="message" x1="685" y1="1200" x2="425" y2="1200" />
  <text class="label" x="555" y="1190">Plan state, evidence, done/error</text>

  <line class="message" x1="425" y1="1234" x2="165" y2="1234" />
  <text class="label" x="295" y="1224">Show applied change and verification</text>

  <text class="small-label" x="590" y="1284">Four timelines: user, app, harness, model</text>
</svg>
