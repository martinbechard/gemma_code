<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="title desc">
  <title id="title">Auto mode harness state machine</title>
  <desc id="desc">State machine for Code Auto mode. Planning accumulates one accepted plan step at a time while allowing read-only tool calls, focused questions, or the plan done sentinel. After validation and semantic review, execution runs each step body and verify counterpart until the step passes, then moves to the next step.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31546f" />
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7f8d" />
    </marker>
    <style>
      .background { fill: #f7f4ee; }
      .panel { fill: #fffdf8; stroke: #d9d1c2; stroke-width: 1.5; }
      .group { fill: #ffffff; stroke: #d9d1c2; stroke-width: 1.6; }
      .title { fill: #21313d; font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: 700; }
      .subtitle { fill: #56636e; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 500; }
      .group-title { fill: #7a4b16; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; }
      .state { fill: #ffffff; stroke: #31546f; stroke-width: 2.2; }
      .state-soft { fill: #eef5f4; stroke: #7aa69b; stroke-width: 2; }
      .terminal { fill: #eef1f4; stroke: #6f7f8d; stroke-width: 2; }
      .error { fill: #fff2ee; stroke: #bc7660; stroke-width: 2; }
      .decision { fill: #eef5f4; stroke: #7aa69b; stroke-width: 2; }
      .note { fill: #fff7ea; stroke: #c7945d; stroke-width: 1.6; }
      .text { fill: #21313d; font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .text-small { fill: #394a56; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .note-text { fill: #7a4b16; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .label { fill: #394a56; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .line { fill: none; stroke: #31546f; stroke-width: 2.2; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #6f7f8d; stroke-width: 2; marker-end: url(#arrow-soft); }
      .loop { fill: none; stroke: #c7945d; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="background" x="0" y="0" width="1600" height="1300" />
  <rect class="panel" x="30" y="30" width="1540" height="1240" rx="20" />

  <text class="title" x="70" y="82">Auto Mode Harness State Machine</text>
  <text class="subtitle" x="70" y="112">Planning accumulates a reviewed plan; execution advances only after each step and its verify counterpart pass.</text>

  <rect class="group" x="70" y="150" width="600" height="980" rx="14" />
  <text class="group-title" x="98" y="184">1. Planning And Accumulation</text>

  <rect class="state" x="110" y="220" width="220" height="70" rx="10" />
  <text class="text" x="220" y="249">Auto code request</text>
  <text class="text-small" x="220" y="270">mode code plus workingDir</text>

  <rect class="state" x="410" y="220" width="220" height="70" rx="10" />
  <text class="text" x="520" y="249">Planning prompt</text>
  <text class="text-small" x="520" y="270">read-only tools allowed</text>

  <path class="line" d="M330 255 H410" />

  <polygon class="decision" points="370,350 510,430 370,510 230,430" />
  <text class="text" x="370" y="420">Planning turn</text>
  <text class="text-small" x="370" y="440">model returns one form</text>

  <path class="line" d="M520 290 V330 H370 V350" />

  <rect class="state-soft" x="105" y="570" width="210" height="80" rx="10" />
  <text class="text" x="210" y="600">Read-only tool call</text>
  <text class="text-small" x="210" y="620">inspect, search, read</text>

  <rect class="state-soft" x="425" y="570" width="210" height="80" rx="10" />
  <text class="text" x="530" y="600">One Step YAML</text>
  <text class="text-small" x="530" y="620">validate and accumulate</text>

  <rect class="terminal" x="105" y="750" width="210" height="80" rx="10" />
  <text class="text" x="210" y="780">Focused question</text>
  <text class="text-small" x="210" y="800">pause until user answers</text>

  <rect class="state" x="425" y="750" width="210" height="80" rx="10" />
  <text class="text" x="530" y="780">End sentinel</text>
  <text class="text-small" x="530" y="800">plan: done</text>

  <path class="line-soft" d="M278 483 L210 570" />
  <text class="label" x="227" y="535">tool action</text>

  <path class="line-soft" d="M462 483 L530 570" />
  <text class="label" x="515" y="535">one step</text>

  <path class="line-soft" d="M300 497 L210 750" />
  <text class="label" x="218" y="704">question</text>

  <path class="line-soft" d="M440 497 L530 750" />
  <text class="label" x="527" y="704">done sentinel</text>

  <path class="line-soft" d="M210 650 V685 H370 V510" />

  <path class="line-soft" d="M530 650 V685 H370 V510" />

  <rect class="note" x="130" y="925" width="470" height="130" rx="10" />
  <text class="note-text" x="365" y="958">Planning invariant</text>
  <text class="text-small" x="365" y="986">Tool calls return planning evidence, not plan steps.</text>
  <text class="text-small" x="365" y="1010">Each accepted Step is appended to the in-memory plan.</text>
  <text class="text-small" x="365" y="1034">The sentinel is valid only when accumulated steps form a plan.</text>

  <rect class="group" x="725" y="150" width="360" height="980" rx="14" />
  <text class="group-title" x="753" y="184">2. Plan Validation And Review</text>

  <rect class="state" x="775" y="220" width="260" height="78" rx="10" />
  <text class="text" x="905" y="249">Deterministic validation</text>
  <text class="text-small" x="905" y="270">shape and executable steps</text>

  <path class="line" d="M635 790 H700 V259 H775" />
  <text class="label" x="690" y="774">steps exist</text>

  <rect class="state" x="775" y="390" width="260" height="78" rx="10" />
  <text class="text" x="905" y="419">Semantic review loop</text>
  <text class="text-small" x="905" y="440">pass or corrected plan</text>

  <path class="line" d="M905 298 V390" />

  <path class="line-soft" d="M1035 429 H1065 V340 H905 V390" />
  <text class="label" x="1002" y="335">review rejected: retry</text>

  <rect class="state" x="775" y="570" width="260" height="78" rx="10" />
  <text class="text" x="905" y="599">Reset execution context</text>
  <text class="text-small" x="905" y="620">use execution prompt</text>

  <path class="line" d="M905 468 V570" />
  <text class="label" x="980" y="525">valid reviewed plan</text>

  <rect class="error" x="795" y="790" width="220" height="80" rx="10" />
  <text class="text" x="905" y="820">Planning fails</text>
  <text class="text-small" x="905" y="840">validation or review retry cap</text>

  <path class="line-soft" d="M775 259 H735 V830 H795" />
  <text class="label" x="754" y="365">invalid too often</text>

  <path class="line-soft" d="M775 429 H735 V830 H795" />
  <text class="label" x="752" y="540">review retry cap</text>

  <rect class="group" x="1140" y="150" width="390" height="980" rx="14" />
  <text class="group-title" x="1168" y="184">3. Execution And Verification</text>

  <rect class="state" x="1200" y="220" width="270" height="78" rx="10" />
  <text class="text" x="1335" y="249">Start or resume next step</text>
  <text class="text-small" x="1335" y="270">nextPrompt returns step</text>

  <path class="line" d="M1035 609 H1100 V259 H1200" />

  <rect class="state" x="1200" y="390" width="270" height="78" rx="10" />
  <text class="text" x="1335" y="419">Execute step body</text>
  <text class="text-small" x="1335" y="440">tools, file changes, summary</text>

  <path class="line" d="M1335 298 V390" />

  <rect class="state" x="1200" y="570" width="270" height="78" rx="10" />
  <text class="text" x="1335" y="599">Run verify counterpart</text>
  <text class="text-small" x="1335" y="620">read-only evidence only</text>

  <path class="line" d="M1335 468 V570" />
  <text class="label" x="1420" y="526">finishStepBody</text>

  <polygon class="decision" points="1335,720 1470,795 1335,870 1200,795" />
  <text class="text" x="1335" y="786">Verification result</text>
  <text class="text-small" x="1335" y="806">pass or fail</text>

  <path class="line" d="M1335 648 V720" />

  <path class="line-soft" d="M1200 795 H1160 V429 H1200" />
  <text class="label" x="1165" y="700">fail: retry same step</text>
  <text class="label" x="1165" y="718">with reason</text>

  <path class="line-soft" d="M1200 795 H1110 V830 H1015" />
  <text class="label" x="1108" y="815">too many failures</text>

  <rect class="terminal" x="1200" y="935" width="270" height="78" rx="10" />
  <text class="text" x="1335" y="964">Step passes</text>
  <text class="text-small" x="1335" y="985">advanceAfterStep</text>

  <path class="line" d="M1335 870 V935" />
  <text class="label" x="1412" y="906">pass</text>

  <path class="line-soft" d="M1200 974 H1130 V259 H1200" />
  <text class="label" x="1140" y="930">more steps</text>

  <rect class="terminal" x="1200" y="1070" width="270" height="78" rx="10" />
  <text class="text" x="1335" y="1099">All steps pass</text>
  <text class="text-small" x="1335" y="1120">emit done</text>

  <path class="line" d="M1335 1013 V1070" />
  <text class="label" x="1406" y="1042">last step</text>

  <text class="text-small" x="800" y="1216">Execution is not a batch run: every step body is followed by its verify prompt, and only a passing verify advances the plan.</text>
</svg>
